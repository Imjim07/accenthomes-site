<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accent Homes — Momentarily Unavailable</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #181818;
    color: #F8F8F8;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    text-align: center;
  }

  .mark {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 4.5rem;
    font-weight: 400;
    color: #8B5E3C;
    letter-spacing: 0.06em;
    line-height: 1;
    margin-bottom: 20px;
    user-select: none;
  }

  .wordmark {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.5rem;
    font-weight: 400;
    color: #F8F8F8;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(248, 248, 248, 0.35);
    margin-bottom: 56px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #8B5E3C;
    margin: 0 auto 48px;
    opacity: 0.6;
  }

  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.55rem;
    font-weight: 400;
    color: #F8F8F8;
    letter-spacing: 0.01em;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .sub {
    font-size: 0.95rem;
    line-height: 1.7;
    color: rgba(248, 248, 248, 0.55);
    max-width: 360px;
    margin: 0 auto 48px;
  }

  .retry {
    display: inline-block;
    background: transparent;
    border: 1px solid rgba(139, 94, 60, 0.5);
    color: #8B5E3C;
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 13px 32px;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .retry:hover {
    border-color: #8B5E3C;
    background: rgba(139, 94, 60, 0.08);
    color: #A8784F;
  }

  .footer {
    position: fixed;
    bottom: 28px;
    left: 0; right: 0;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(248, 248, 248, 0.2);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="mark">Λ</div>
  <div class="wordmark">Accent Homes</div>
  <div class="tagline">Luxury Short-Let · Asaba</div>

  <div class="divider"></div>

  <h1 class="headline">We're momentarily unavailable.</h1>
  <p class="sub">Try again in a few minutes — we'll be back shortly.</p>

  <a class="retry" href="javascript:location.reload()">Try again</a>

  <div class="footer">© 2025 Accent Homes &nbsp;·&nbsp; Asaba, Delta State</div>

</body>
</html>
